spring.application.name=CampusPulse AI — Java Edition
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campuspulse?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:campuspulse}
spring.datasource.password=${DB_PASSWORD:campuspulse_dev_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.thymeleaf.cache=false
app.demo.seed=${APP_DEMO_SEED:true}
app.grok.api-key=${XAI_API_KEY:}
app.grok.base-url=${XAI_BASE_URL:https://api.x.ai/v1}
app.grok.model=${XAI_MODEL:grok-4.7}
logging.level.org.springframework.security=WARN
