services:
  mysql:
    image: mysql:8.4
    container_name: campuspulse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campuspulse
      MYSQL_USER: campuspulse
      MYSQL_PASSWORD: campuspulse_dev_password
      MYSQL_ROOT_PASSWORD: local_root_change_me
    ports:
      - "3306:3306"
    volumes:
      - campuspulse_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "campuspulse", "-pcampuspulse_dev_password"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  campuspulse_mysql_data:
